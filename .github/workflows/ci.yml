name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FR_TEST_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: tests (failures are also raised as annotations)
        run: |
          set -o pipefail
          pytest -q -rs --tb=line 2>&1 | tee out.txt || {
            grep -E "^(FAILED|ERROR)|Error:|error:|^E " out.txt | head -10 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: fail if any integration test was skipped
        run: '! grep -qi "skipped" out.txt'
