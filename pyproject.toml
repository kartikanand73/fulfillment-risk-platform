[project]
name = "fulfillment-risk"
version = "0.1.0"
description = "Which Salesforce customers have open Databricks orders that current Snowflake inventory cannot fulfil - deterministic refresh into a PostgreSQL snapshot."
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.1", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]
azure = ["azure-identity>=1.17", "azure-keyvault-secrets>=4.8", "azure-monitor-opentelemetry>=1.6"]
signals = ["azure-identity>=1.17", "azure-eventhub>=5.11"]

[project.scripts]
fulfillment-risk = "fulfillment_risk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fulfillment_risk*"]

[tool.setuptools.package-data]
fulfillment_risk = ["store/schema.sql", "signals/signals.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
