[project]
name = "fulfillment-risk"
version = "0.1.0"
description = "Which Salesforce customers have open Databricks orders that current Snowflake inventory cannot fulfil - deterministic refresh into a PostgreSQL snapshot."
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fulfillment-risk = "fulfillment_risk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fulfillment_risk*"]

[tool.setuptools.package-data]
fulfillment_risk = ["store/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
